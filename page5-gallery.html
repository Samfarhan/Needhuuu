<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Vault | Needhzy's Memories</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Playfair+Display:ital,wght@0,900;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        .font-luxury { font-family: 'Playfair Display', serif; }
        .font-sans-premium { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .premium-gpu {
            will-change: transform, opacity;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Fluid Cyber Pastel Shifting Background Mesh */
        @keyframes dynamicSky {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-gallery-bg {
            background: linear-gradient(-45deg, #ffd6e8, #e0e7ff, #bae6fd, #fdf2f8);
            background-size: 400% 400%;
            animation: dynamicSky 12s ease infinite;
        }

        /* 🔄 COMPACT RESPONSIVE VIEWPORT BOUNDS FOR MASCOT STICKER */
        @keyframes safeMascotTrack {
            0% { top: 12%; left: 6%; transform: scale(1) rotate(0deg); }
            25% { top: 14%; left: 62%; transform: scale(1.05) rotate(6deg); }
            50% { top: 70%; left: 64%; transform: scale(0.95) rotate(-6deg); }
            75% { top: 64%; left: 8%; transform: scale(1.02) rotate(4deg); }
            100% { top: 12%; left: 6%; transform: scale(1) rotate(0deg); }
        }
        .animate-safe-mascot {
            position: fixed;
            animation: safeMascotTrack 18s linear infinite;
        }

        /* Aesthetic Polaroid Drop Shadows & Holographic Inner Border Glow */
        .polaroid-glow {
            box-shadow: 0 15px 35px rgba(244, 63, 94, 0.06), inset 0 0 15px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body id="masterBody" class="animated-gallery-bg text-slate-800 font-sans-premium min-h-screen overflow-x-hidden overflow-y-auto relative select-none flex flex-col items-center justify-start p-4 pb-28">

    <audio id="sfxPop" src="sfx/pop.wav" preload="auto"></audio>
    <audio id="sfxSuccess" src="sfx/success.wav" preload="auto"></audio>

    <canvas id="touchCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-40"></canvas>

    <div id="roamingDoll" class="animate-safe-mascot w-20 h-28 cursor-pointer select-none z-40 premium-gpu filter drop-shadow-[0_10px_20px_rgba(244,63,94,0.12)]">
        <img id="mascotDynamicImg" src="images/mascot.png" class="w-full h-full object-contain" alt="Mascot Doll" onclick="triggerMascotGalleryTalk()">
        
        <div id="dollBubble" class="absolute -top-10 left-1/2 -translate-x-1/2 bg-white border border-pink-100 py-1 px-3 rounded-xl shadow-md text-[9px] font-extrabold text-pink-500 tracking-wide scale-100 transition-all duration-300 whitespace-nowrap">
            Tap to view our memories! 📸✨
        </div>
    </div>

    <div class="text-center mt-8 mb-8 relative z-20 w-full max-w-sm" id="galleryHeader">
        <span class="text-[9px] font-extrabold tracking-[0.45em] text-pink-600 uppercase block mb-1 animate-pulse">VISUAL MATRIX STORAGE</span>
        <h1 class="font-luxury font-black text-3xl text-indigo-950 leading-tight">Needhzy's Photo Core 🌸</h1>
        <p class="text-[11px] font-medium text-slate-500 mt-2">Our absolute most special moments, framed perfectly</p>
    </div>

    <div id="dynamicPolaroidGrid" class="w-full max-w-sm grid grid-cols-2 gap-4 px-2 relative z-20">
    </div>

    <div id="actionFooterBar" class="w-full max-w-xs mt-12 relative z-20 text-center px-4">
        <button onclick="advanceToReasonPage()" class="w-full bg-gradient-to-r from-pink-400 via-rose-400 to-purple-500 text-white font-extrabold tracking-[0.2em] text-[10px] py-4 rounded-xl shadow-md shadow-pink-300/30 hover:scale-[1.02] active:scale-95 transition-all border border-white/20 premium-gpu">
            PROCEED TO REASONS 💖🚀
        </button>
    </div>

    <div id="lightboxOverlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300" onclick="closeLightboxView()">
        <div class="absolute top-5 right-5 text-white text-xl bg-white/10 w-10 h-10 rounded-full flex items-center justify-center cursor-pointer hover:bg-white/20" onclick="closeLightboxView()">❌</div>
        
        <div class="bg-white p-4 pb-6 rounded-[2rem] shadow-2xl max-w-sm w-full transform scale-90 transition-transform duration-300" id="lightboxContentCard" onclick="event.stopPropagation()">
            <div class="w-full aspect-square bg-slate-100 rounded-2xl overflow-hidden mb-4">
                <img id="lightboxTargetImg" src="" class="w-full h-full object-cover" alt="Zoomed Shard">
            </div>
            <p id="lightboxCaptionText" class="font-luxury font-black text-sm text-indigo-950 text-center italic px-2"></p>
        </div>
    </div>

    <script>
        // 🎀 EXCLUSIVE NEEDHZY COMPLIMENT STRINGS
        const needhzyGalleryTalks = [
            "You look absolutely breathtaking in these photos, Needhzy! 😍🎀",
            "My eyes are permanently locked on your frames! 👸🏻🌸",
            "OMG! Literally the prettiest human in existence! 💖",
            "Every shard here reminds me of your gorgeous smile! 🥰⚡",
            "Click the bottom button to see why you are so special! 💖🚀"
        ];
        let trackingTalksPool = [...needhzyGalleryTalks];

        // 📸 DYNAMIC FILE STRUCTURE PARAMETERS ENGINE (8 total slots)
        const totalImagesAllocated = 8;
        
        const photoMetadata = {
            1: { title: "Prettiest Smile ✨", caption: "Your absolute cutest smile! 🥰" },
            2: { title: "Drama Queen 👑", caption: "That day you got extra dramatic! 👸🏻🎀" },
            3: { title: "Endless Pings 💬", caption: "Our sweet endless chat snapshots! 💬💞" },
            4: { title: "Aesthetic Vibe 🌸", caption: "You look so incredibly pretty here! ❤️" },
            5: { title: "Pure Elegance ✨", caption: "Stunning as always, Needhzy! 😍" },
            6: { title: "Cute Shard 🎀", caption: "Literally the most adorable face ever! 💕" },
            7: { title: "Sweet Moment 💝", caption: "A beautiful memory close to my heart! 🌟" },
            8: { title: "The Sovereign 👑", caption: "The absolute queen of my private galaxy! 🌌" }
        };

        const playSFX = (id) => {
            const audio = document.getElementById(id);
            if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
        };

        window.addEventListener('DOMContentLoaded', () => {
            playSFX('sfxSuccess');
            injectDynamicPolaroidGridEngine();
        });

        // 🧠 DYNAMIC GRID GENERATOR INJECTION FRAMEWORK
        function injectDynamicPolaroidGridEngine() {
            const gridContainer = document.getElementById("dynamicPolaroidGrid");
            
            for (let i = 1; i <= totalImagesAllocated; i++) {
                const meta = photoMetadata[i];
                const imgPath = `images/pic${i}.jpg`;
                
                const rotationAngles = [-3, 3, 1, -2, 2, -1, 3, -3];
                const currentTilt = rotationAngles[(i - 1) % rotationAngles.length];

                const cardHtml = `
                    <div class="bg-white/90 p-3 rounded-2xl polaroid-glow border border-white/60 polaroid-card opacity-0 scale-90"
                         style="transform: rotate(${currentTilt}deg);"
                         onclick="openLightboxView('${imgPath}', '${meta.caption}')"
                         data-index="${i}">
                        <div class="w-full aspect-square bg-slate-100 rounded-xl overflow-hidden mb-2 relative">
                            <img src="${imgPath}" class="w-full h-full object-cover text-[10px] text-slate-400 font-mono flex items-center justify-center p-2 text-center" 
                                 alt="[Photo ${i} Pending]" 
                                 onerror="handleMissingPhotoCard(this, ${i})">
                        </div>
                        <p class="font-luxury font-bold text-xs text-indigo-950 text-center truncate italic">${meta.title}</p>
                    </div>
                `;
                gridContainer.innerHTML += cardHtml;
            }

            setTimeout(() => {
                gsap.to(".polaroid-card", {
                    opacity: 1,
                    scale: 1,
                    y: 0,
                    duration: 0.6,
                    stagger: 0.08,
                    ease: "back.out(1.15)"
                });
            }, 200);
        }

        function handleMissingPhotoCard(imageElement, index) {
            imageElement.parentElement.innerHTML = `
                <div class="w-full h-full bg-gradient-to-br from-pink-50 to-purple-50 flex flex-col items-center justify-center text-center p-2">
                    <span class="text-xl opacity-40 animate-pulse">🔒</span>
                    <span class="text-[8px] font-black text-pink-400 tracking-wider uppercase mt-1">Slot 0${index} Locked</span>
                </div>
            `;
        }

        function openLightboxView(imagePath, captionText) {
            playSFX('sfxPop');
            
            const overlay = document.getElementById("lightboxOverlay");
            const card = document.getElementById("lightboxContentCard");
            
            document.getElementById("lightboxTargetImg").src = imagePath;
            document.getElementById("lightboxCaptionText").innerText = captionText;

            overlay.classList.remove("pointer-events-none", "opacity-0");
            overlay.classList.add("opacity-100");
            
            gsap.to(card, { scale: 1, duration: 0.3, ease: "back.out(1.2)" });
        }

        function closeLightboxView() {
            playSFX('sfxPop');
            const overlay = document.getElementById("lightboxOverlay");
            const card = document.getElementById("lightboxContentCard");

            gsap.to(card, { scale: 0.9, duration: 0.2, onComplete: () => {
                overlay.classList.remove("opacity-100");
                overlay.classList.add("pointer-events-none", "opacity-0");
            }});
        }

        function triggerMascotGalleryTalk() {
            playSFX('sfxPop');
            const bubble = document.getElementById("dollBubble");
            const targetImg = document.getElementById("mascotDynamicImg");

            if (trackingTalksPool.length === 0) trackingTalksPool = [...needhzyGalleryTalks];
            const randomIndex = Math.floor(Math.random() * trackingTalksPool.length);
            bubble.innerText = trackingTalksPool.splice(randomIndex, 1)[0];

            const expressions = ["images/mascot_happy.png", "images/mascot_excited.png", "images/mascot_confused.png"];
            targetImg.src = expressions[Math.floor(Math.random() * expressions.length)];

            gsap.fromTo("#roamingDoll", { scale: 0.95 }, { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1 });

            setTimeout(() => {
                targetImg.src = "images/mascot.png";
                bubble.innerText = "Tap to view our memories! 📸✨";
            }, 3500);

            const r = document.getElementById("roamingDoll").getBoundingClientRect();
            for(let i=0; i<5; i++) touchParticles.push(new TouchSparkle(r.left + 35, r.top + 35, '💖'));
        }

        /* ✅ PERFECT DIRECTIONAL GATEWAY TUNED FOR PAGE6-REASON.HTML */
        function advanceToReasonPage() {
            playSFX('sfxPop');
            gsap.to("body", { opacity: 0, duration: 0.5, onComplete: () => {
                window.location.href = "page6-reasons.html";
            }});
        }

        // --- MOBILE OPTIMIZED TOUCH SPARK TRAIL ENGINE ---
        const touchCanvas = document.getElementById('touchCanvas');
        const tCtx = touchCanvas.getContext('2d');
        let touchParticles = [];
        touchCanvas.width = window.innerWidth; touchCanvas.height = window.innerHeight;

        class TouchSparkle {
            constructor(x, y, sym = '✨') {
                this.x = x; this.y = y; this.size = Math.random() * 12 + 10;
                this.speedX = (Math.random() - 0.5) * 4; this.speedY = (Math.random() - 0.5) * 4;
                this.opacity = 1; this.symbol = sym;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.opacity -= 0.02; }
            draw() { tCtx.save(); tCtx.globalAlpha = this.opacity; tCtx.font = `${this.size}px serif`; tCtx.fillText(this.symbol, this.x, this.y); tCtx.restore(); }
        }

        window.addEventListener('mousemove', (e) => { touchParticles.push(new TouchSparkle(e.clientX, e.clientY)); });
        window.addEventListener('touchmove', (e) => { if(e.touches.length) touchParticles.push(new TouchSparkle(e.touches[0].clientX, e.touches[0].clientY)); });

        function animateTouchTrail() {
            tCtx.clearRect(0, 0, touchCanvas.width, touchCanvas.height);
            for (let i = 0; i < touchParticles.length; i++) {
                touchParticles[i].update(); touchParticles[i].draw();
                if (touchParticles[i].opacity <= 0) { touchParticles.splice(i, 1); i--; }
            }
            requestAnimationFrame(animateTouchTrail);
        }
        animateTouchTrail();
    </script>
</body>
</html>
