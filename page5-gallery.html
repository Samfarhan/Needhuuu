<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Vault | Needhzy's Memories</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,800;1,600&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        .font-luxury { font-family: 'Playfair Display', serif; }
        .font-sans-premium { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .premium-gpu {
            will-change: transform, opacity, filter;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 🌌 DEEP CINEMATIC COSMIC AURA BACKGROUND */
        .animated-cosmic-dark-bg {
            background: radial-gradient(circle at 50% 30%, rgba(30, 15, 45, 0.98) 0%, rgba(8, 5, 18, 0.99) 60%, #020106 100%), 
                        radial-gradient(circle at center, transparent 10%, rgba(0, 0, 0, 0.95) 100%);
            position: relative;
        }

        /* 🔄 RESPONSIVE VIEWPORT BOUNDS FOR MASCOT STICKER */
        @keyframes safeMascotTrack {
            0% { top: 12%; left: 6%; transform: scale(1) rotate(0deg); }
            25% { top: 14%; left: 62%; transform: scale(1.05) rotate(6deg); }
            50% { top: 70%; left: 64%; transform: scale(0.95) rotate(-6deg); }
            75% { top: 64%; left: 8%; transform: scale(1.02) rotate(4deg); }
            100% { top: 12%; left: 6%; transform: scale(1) rotate(0deg); }
        }
        .animate-safe-mascot {
            position: fixed;
            animation: safeMascotTrack 18s linear infinite;
        }

        /* 💎 ULTRA-AESTHETIC GLASS VAULT POLAROID CARD */
        .glass-vault-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(18, 12, 35, 0.75) 100%);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.25),
                        0 0 35px rgba(244, 63, 94, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-vault-card:hover {
            border-color: rgba(244, 63, 94, 0.5);
            box-shadow: 0 25px 60px rgba(244, 63, 94, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .text-glow-rose {
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.6), 0 0 40px rgba(236, 72, 153, 0.3);
        }

        .async-glow-node {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            filter: blur(55px);
            opacity: 0.5;
        }
    </style>
</head>
<body id="masterBody" class="animated-cosmic-dark-bg text-slate-100 font-sans-premium min-h-screen overflow-x-hidden overflow-y-auto relative select-none flex flex-col items-center justify-start p-4 pb-28">

    <!-- AUDIO SFX ENGINE -->
    <audio id="sfxPop" src="sfx/pop.wav" preload="auto"></audio>
    <audio id="sfxSuccess" src="sfx/success.wav" preload="auto"></audio>

    <!-- BACKGROUND AMBIENT GLOW NODES -->
    <div id="asyncLightsMatrix" class="absolute inset-0 pointer-events-none z-0"></div>

    <canvas id="touchCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-40"></canvas>

    <!-- 🌸 FLOATING MASCOT STICKER -->
    <div id="roamingDoll" class="animate-safe-mascot w-20 h-28 cursor-pointer select-none z-40 premium-gpu filter drop-shadow-[0_12px_25px_rgba(244,63,94,0.35)]">
        <img id="mascotDynamicImg" src="images/mascot.png" onerror="handleMascotLoadError(this)" class="w-full h-full object-contain" alt="Mascot Doll" onclick="triggerMascotGalleryTalk()">
        
        <div id="dollBubble" class="absolute -top-11 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md border border-pink-500/30 py-1 px-3.5 rounded-xl shadow-xl text-[9px] font-extrabold text-pink-300 tracking-wide scale-100 transition-all duration-300 whitespace-nowrap">
            Tap to view our memories Bettuu! 📸✨
        </div>
    </div>

    <!-- GALLERY HEADER BLOCK -->
    <div class="text-center mt-8 mb-8 relative z-20 w-full max-w-sm px-2" id="galleryHeader">
        <div class="flex items-center justify-center gap-2 mb-1">
            <span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-ping"></span>
            <span class="text-[9px] font-extrabold tracking-[0.45em] text-pink-400 uppercase block">VISUAL MATRIX STORAGE</span>
        </div>
        <h1 class="font-luxury font-black text-3xl sm:text-4xl text-transparent bg-clip-text bg-gradient-to-r from-white via-pink-100 to-rose-300 leading-tight text-glow-rose">
            Needhzy's Photo Core 🌸
        </h1>
        <p class="text-[11px] font-medium text-slate-300 mt-2">Our absolute most special moments, framed perfectly</p>
    </div>

    <!-- DYNAMIC POLAROID GRID -->
    <div id="dynamicPolaroidGrid" class="w-full max-w-sm grid grid-cols-2 gap-4 px-2 relative z-20">
    </div>

    <!-- ACTION FOOTER BAR -->
    <div id="actionFooterBar" class="w-full max-w-sm mt-10 relative z-20 text-center px-2">
        <button onclick="advanceToReasonPage()" class="w-full bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-extrabold tracking-[0.25em] text-[10px] py-4 rounded-xl shadow-[0_10px_25px_rgba(244,63,94,0.4)] hover:scale-[1.02] active:scale-95 transition-all duration-200 border border-white/20 premium-gpu">
            PROCEED TO REASONS 💖🚀
        </button>
    </div>

    <!-- LIGHTBOX OVERLAY MODAL -->
    <div id="lightboxOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300" onclick="closeLightboxView()">
        <div class="absolute top-5 right-5 text-slate-400 hover:text-white text-xl bg-slate-900/80 border border-white/10 w-10 h-10 rounded-full flex items-center justify-center cursor-pointer transition-all" onclick="closeLightboxView()">❌</div>
        
        <div class="glass-vault-card p-4 pb-6 rounded-[2.5rem] shadow-[0_30px_80px_rgba(0,0,0,0.9)] max-w-sm w-full transform scale-90 transition-transform duration-300 relative overflow-hidden" id="lightboxContentCard" onclick="event.stopPropagation()">
            <div class="w-full aspect-square bg-slate-950/60 border border-white/10 rounded-2xl overflow-hidden mb-4 relative">
                <img id="lightboxTargetImg" src="" class="w-full h-full object-cover" alt="Zoomed Shard">
            </div>
            <p id="lightboxCaptionText" class="font-luxury font-black text-sm text-pink-200 text-center italic px-2 tracking-wide"></p>
        </div>
    </div>

    <script>
        const needhzyGalleryTalks = [
            "You look absolutely breathtaking in these photos, Needhzy! 😍🎀",
            "My eyes are permanently locked on your frames! 👸🏻🌸",
            "OMG! Literally the prettiest human in existence! 💖",
            "Every shard here reminds me of your gorgeous smile! 🥰⚡",
            "Click the bottom button to see why you are so special! 💖🚀"
        ];
        let trackingTalksPool = [...needhzyGalleryTalks];

        const totalImagesAllocated = 8;
        
        const photoMetadata = {
            1: { title: "Prettiest Smile ✨", caption: "The smile that somehow makes every day brighter. 🤍"" },
            2: { title: "Playful Charm 🌸", caption: "A little chaos, a lot of happiness, always you. 👑" },
            3: { title: "Saree Serenity 🌼", caption: "Grace isn't worn, it's simply a part of you. ✨" },
            4: { title: "Simply Beautiful 🌷", caption: "No filters, no effort... just naturally beautiful. 🌷" },
            5: { title: "Divine Grace ❤️ ", caption: "Some moments deserve to be admired forever. 🌺" },
            6: { title: "Cute Shard 🎀", caption: "Tiny smile, endless happiness packed in one frame. 💝" },
            7: { title: "Peaceful Glow 🍃", caption: "A peaceful heart always shines the brightest. 🌿" },
            8: { title: "Born to Shine 🌟", caption: "Wherever you go, you leave a little light behind. 👑" }
        };

        function handleMascotLoadError(imgObj) {
            const currentSrc = imgObj.src;
            if (currentSrc.includes('images/')) {
                imgObj.src = currentSrc.replace('images/', '');
            }
        }

        const playSFX = (id) => {
            const audio = document.getElementById(id);
            if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initAmbientLighting();
            playSFX('sfxSuccess');
            injectDynamicPolaroidGridEngine();
        });

        function injectDynamicPolaroidGridEngine() {
            const gridContainer = document.getElementById("dynamicPolaroidGrid");
            
            for (let i = 1; i <= totalImagesAllocated; i++) {
                const meta = photoMetadata[i];
                const imgPath = `images/pic${i}.jpg`;
                
                const rotationAngles = [-2, 2, 1, -1, 2, -2, 1, -1];
                const currentTilt = rotationAngles[(i - 1) % rotationAngles.length];

                const cardHtml = `
                    <div class="glass-vault-card p-3 rounded-[2rem] polaroid-card opacity-0 scale-90 cursor-pointer"
                         style="transform: rotate(${currentTilt}deg);"
                         onclick="openLightboxView('${imgPath}', '${meta.caption}')"
                         data-index="${i}">
                        <div class="w-full aspect-square bg-slate-950/60 border border-white/10 rounded-2xl overflow-hidden mb-2 relative">
                            <img src="${imgPath}" class="w-full h-full object-cover text-[10px] text-slate-400 font-mono flex items-center justify-center p-2 text-center" 
                                 alt="[Photo ${i} Pending]" 
                                 onerror="handleMissingPhotoCard(this, ${i})">
                        </div>
                        <p class="font-luxury font-bold text-xs text-pink-200 text-center truncate italic">${meta.title}</p>
                    </div>
                `;
                gridContainer.innerHTML += cardHtml;
            }

            setTimeout(() => {
                gsap.to(".polaroid-card", {
                    opacity: 1,
                    scale: 1,
                    y: 0,
                    duration: 0.6,
                    stagger: 0.08,
                    ease: "back.out(1.15)"
                });
            }, 200);
        }

        function handleMissingPhotoCard(imageElement, index) {
            imageElement.parentElement.innerHTML = `
                <div class="w-full h-full bg-slate-950/80 flex flex-col items-center justify-center text-center p-2 border border-pink-500/20 rounded-2xl">
                    <span class="text-xl opacity-40 animate-pulse">🔒</span>
                    <span class="text-[8px] font-black text-pink-400 tracking-wider uppercase mt-1">Slot 0${index} Locked</span>
                </div>
            `;
        }

        function openLightboxView(imagePath, captionText) {
            playSFX('sfxPop');
            
            const overlay = document.getElementById("lightboxOverlay");
            const card = document.getElementById("lightboxContentCard");
            
            const targetImg = document.getElementById("lightboxTargetImg");
            targetImg.src = imagePath;
            targetImg.onerror = function() {
                this.onerror = null;
                this.src = imagePath.replace('images/', '');
            };

            document.getElementById("lightboxCaptionText").innerText = captionText;

            overlay.classList.remove("pointer-events-none", "opacity-0");
            overlay.classList.add("opacity-100");
            
            gsap.to(card, { scale: 1, duration: 0.3, ease: "back.out(1.2)" });
        }

        function closeLightboxView() {
            playSFX('sfxPop');
            const overlay = document.getElementById("lightboxOverlay");
            const card = document.getElementById("lightboxContentCard");

            gsap.to(card, { scale: 0.9, duration: 0.2, onComplete: () => {
                overlay.classList.remove("opacity-100");
                overlay.classList.add("pointer-events-none", "opacity-0");
            }});
        }

        function triggerMascotGalleryTalk() {
            playSFX('sfxPop');
            const bubble = document.getElementById("dollBubble");
            const targetImg = document.getElementById("mascotDynamicImg");

            if (trackingTalksPool.length === 0) trackingTalksPool = [...needhzyGalleryTalks];
            const randomIndex = Math.floor(Math.random() * trackingTalksPool.length);
            bubble.innerText = trackingTalksPool.splice(randomIndex, 1)[0];

            const expressions = ["mascot_happy.png", "mascot_excited.png", "mascot_confused.png"];
            const randomImg = expressions[Math.floor(Math.random() * expressions.length)];
            
            targetImg.src = `images/${randomImg}`;
            targetImg.onerror = function() { this.onerror = null; this.src = randomImg; };

            gsap.fromTo("#roamingDoll", { scale: 0.95 }, { scale: 1.08, duration: 0.2, yoyo: true, repeat: 1 });

            setTimeout(() => {
                targetImg.src = "images/mascot.png";
                targetImg.onerror = function() { this.onerror = null; this.src = "mascot.png"; };
                bubble.innerText = "Tap to view our memories Bettuu! 📸✨";
            }, 3500);

            const r = document.getElementById("roamingDoll").getBoundingClientRect();
            for(let i=0; i<6; i++) touchParticles.push(new TouchSparkle(r.left + 35, r.top + 35, '💖'));
        }

        function advanceToReasonPage() {
            playSFX('sfxPop');
            gsap.to("body", { opacity: 0, duration: 0.5, onComplete: () => {
                window.location.href = "page6-reasons.html";
            }});
        }

        function initAmbientLighting() {
            const trackLayer = document.getElementById("asyncLightsMatrix");
            for(let i=0; i<5; i++) {
                const node = document.createElement("div");
                node.className = "async-glow-node premium-gpu";
                const size = Math.floor(Math.random() * 80) + 160;
                node.style.left = `calc(${(i * 20) + Math.random() * 5}vw - ${size/2}px)`;
                node.style.top = `${Math.floor(Math.random() * 50) + 10}px`;
                node.style.width = `${size}px`; node.style.height = `${size}px`;
                node.style.background = `radial-gradient(circle, rgba(244, 63, 94, 0.25) 0%, transparent 75%)`;
                trackLayer.appendChild(node);
            }
        }

        // TOUCH SPARKLE CANVAS ENGINE
        const touchCanvas = document.getElementById('touchCanvas');
        const tCtx = touchCanvas.getContext('2d');
        let touchParticles = [];
        touchCanvas.width = window.innerWidth; touchCanvas.height = window.innerHeight;

        class TouchSparkle {
            constructor(x, y, sym = '✨') {
                this.x = x; this.y = y; this.size = Math.random() * 12 + 10;
                this.speedX = (Math.random() - 0.5) * 4; this.speedY = (Math.random() - 0.5) * 4;
                this.opacity = 1; this.symbol = sym;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.opacity -= 0.02; }
            draw() { tCtx.save(); tCtx.globalAlpha = this.opacity; tCtx.font = `${this.size}px serif`; tCtx.fillText(this.symbol, this.x, this.y); tCtx.restore(); }
        }

        window.addEventListener('mousemove', (e) => { touchParticles.push(new TouchSparkle(e.clientX, e.clientY)); });
        window.addEventListener('touchmove', (e) => { if(e.touches.length) touchParticles.push(new TouchSparkle(e.touches[0].clientX, e.touches[0].clientY)); });

        function animateTouchTrail() {
            tCtx.clearRect(0, 0, touchCanvas.width, touchCanvas.height);
            for (let i = 0; i < touchParticles.length; i++) {
                touchParticles[i].update(); touchParticles[i].draw();
                if (touchParticles[i].opacity <= 0) { touchParticles.splice(i, 1); i--; }
            }
            requestAnimationFrame(animateTouchTrail);
        }
        animateTouchTrail();
    </script>
</body>
</html>
