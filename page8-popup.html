<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Bubble Shell | Queen Needhzy</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,700;0,800;1,600&family=Playfair+Display:ital,wght@0,700;0,900;1,600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        .font-luxury { font-family: 'Playfair Display', serif; }
        .font-sans-premium { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .premium-gpu {
            will-change: transform, opacity, filter;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 🌌 DEEP CINEMATIC COSMIC AURA BACKGROUND */
        .animated-cosmic-dark-bg {
            background: radial-gradient(circle at 50% 30%, rgba(30, 15, 45, 0.98) 0%, rgba(8, 5, 18, 0.99) 60%, #020106 100%), 
                        radial-gradient(circle at center, transparent 10%, rgba(0, 0, 0, 0.95) 100%);
            position: relative;
        }

        /* 🔄 CSS VIEWPORT SAFE RESTRAINT FOR FLOATING MASCOT */
        @keyframes safeMascotTrack {
            0% { top: 12%; left: 6%; transform: scale(1) rotate(0deg); }
            25% { top: 14%; left: 62%; transform: scale(1.05) rotate(6deg); }
            50% { top: 70%; left: 64%; transform: scale(0.95) rotate(-6deg); }
            75% { top: 64%; left: 8%; transform: scale(1.02) rotate(4deg); }
            100% { top: 12%; left: 6%; transform: scale(1) rotate(0deg); }
        }
        .animate-safe-mascot {
            position: fixed;
            animation: safeMascotTrack 18s linear infinite;
        }

        /* 💎 ULTRA-AESTHETIC GLASS VAULT CARDS & POPUPS */
        .glass-vault-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(18, 12, 35, 0.75) 100%);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.3),
                        0 0 45px rgba(244, 63, 94, 0.18);
        }

        .glass-pod-glow {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(28, 18, 52, 0.85) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.4),
                        0 0 25px rgba(244, 63, 94, 0.25);
        }

        .text-glow-rose {
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.6), 0 0 40px rgba(236, 72, 153, 0.3);
        }

        .async-glow-node {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            filter: blur(55px);
            opacity: 0.5;
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
        }
    </style>
</head>
<body id="masterBody" class="animated-cosmic-dark-bg text-slate-100 font-sans-premium min-h-screen w-full flex items-center justify-center overflow-hidden select-none relative">

    <!-- AUDIO SFX ENGINE -->
    <audio id="sfxPop" src="sfx/pop.wav" preload="auto"></audio>
    <audio id="sfxSuccess" src="sfx/success.wav" preload="auto"></audio>

    <!-- BACKGROUND AMBIENT GLOW NODES -->
    <div id="asyncLightsMatrix" class="absolute inset-0 pointer-events-none z-0"></div>

    <canvas id="touchCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-40"></canvas>

    <!-- 🌸 FLOATING MASCOT STICKER -->
    <div id="roamingDoll" class="animate-safe-mascot w-20 h-28 cursor-pointer select-none z-40 premium-gpu filter drop-shadow-[0_12px_25px_rgba(244,63,94,0.35)]">
        <img id="mascotDynamicImg" src="images/mascot.png" onerror="handleMascotLoadError(this)" class="w-full h-full object-contain" alt="Mascot Doll" onclick="triggerMascotCoreTalk()">
        
        <div id="dollBubble" class="absolute -top-11 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md border border-pink-500/30 py-1 px-3.5 rounded-xl shadow-xl text-[9px] font-extrabold text-pink-300 tracking-wide scale-100 transition-all duration-300 whitespace-nowrap">
            Don't touch that core panel! 😱🚨
        </div>
    </div>

    <div class="phone-container relative z-10 flex flex-col justify-between p-4 pb-8 overflow-hidden">
        
        <!-- HEADER TITLE BLOCK -->
        <div class="text-center w-full premium-gpu mt-6 relative z-20" id="trapHeader">
            <div class="flex items-center justify-center gap-2 mb-1">
                <span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-ping"></span>
                <span class="text-[9px] font-extrabold tracking-[0.5em] text-pink-400 uppercase block">THE CORE FLOW</span>
            </div>
            <h1 class="font-luxury font-black text-2xl sm:text-3xl text-transparent bg-clip-text bg-gradient-to-r from-white via-pink-100 to-rose-300 leading-tight text-glow-rose">
                The Forbidden Matrix<br>Control Panel Hub 🚨🔮
            </h1>
            <p class="text-[10px] font-medium text-slate-300 mt-1">Warning: Affection overload sequence initialized</p>
        </div>

        <!-- MAIN TRIGGER CONTAINER -->
        <div id="mainTriggerContainer" class="w-full glass-vault-card rounded-[2.5rem] p-6 text-center flex flex-col items-center justify-center py-12 my-auto transition-all premium-gpu z-20">
            <div class="w-16 h-16 rounded-full bg-pink-500/20 border border-pink-500/40 flex items-center justify-center text-2xl mb-4 shadow-[0_0_25px_rgba(244,63,94,0.3)] animate-pulse">⚡</div>
            <h2 class="font-luxury font-black text-base text-white tracking-tight mb-2">Unstable Frequency Node</h2>
            <p class="text-[11px] text-slate-300 font-medium mb-6 px-4">Tap below to release all custom emotional network records at once.</p>
            <button id="dangerTriggerBtn" onclick="initiateMassivePopupBlast(this)" class="w-28 h-28 rounded-full bg-gradient-to-tr from-pink-500 via-rose-500 to-purple-600 text-white font-black tracking-[0.2em] text-[9px] shadow-[0_10px_30px_rgba(244,63,94,0.5)] border-4 border-white/30 active:scale-95 hover:scale-105 transition-all premium-gpu">
                LAUNCH BLAST 🚨
            </button>
        </div>

        <div id="popupSpawnPlane" class="absolute inset-x-4 top-24 bottom-24 pointer-events-none z-30 overflow-hidden rounded-3xl"></div>

        <!-- FOOTER & NAVIGATION -->
        <div class="w-full flex flex-col items-center gap-2 mt-4 relative z-40">
            <div class="text-[8px] font-bold tracking-widest text-slate-400 uppercase" id="progressMetrics">
                SYSTEM CORE STATUS: <span class='text-pink-400 font-black animate-pulse'>STANDBY MODE</span>
            </div>

            <div id="actionFooterBar" class="w-full opacity-0 scale-90 hidden pointer-events-none transition-all duration-500">
                <button onclick="advanceToWishesGrandPage()" class="w-full bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-extrabold tracking-[0.22em] text-[10px] py-4 rounded-xl shadow-[0_10px_25px_rgba(244,63,94,0.4)] border border-white/20 premium-gpu animate-bounce">
                    PROCEED TO WISHES 🎂🚀
                </button>
            </div>
        </div>

    </div>

    <script>
        let currentSpawnIndex = 0;
        let activePopupsCounter = 0;
        let isBlastInitiated = false;

        const pureUniquePhrasesPool = [
            "You are legally mine now! No arguments! 😡❤️",
            "Cutest human alive on this entire planet! 🌸✨",
            "Excuse me, your pouts are highly dangerous! 😤💖",
            "Stop trying to close these, I am everywhere! 👀💎",
            "You belong to my cosmos forever! 🌌🔮",
            "My mood cure station is 100% locked on you! 🥰⚡",
            "You cannot escape my care, Queen Needhzy! 👸🏻👑",
            "Warning: Absolute pure affection overload! 🚨💝",
            "You are completely stuck with me! No bypass! 💕🔒",
            "The prettiest smile in the entire network! ✨👑",
            "You think you can close them all? Try harder! 😜⚡",
            "My favorite notification is always your text! 💬💞",
            "No one else is allowed to be this adorable! 🙅🏻‍♀️🌸",
            "You cross my mind thousands of times a day! 🧠❤️",
            "Your voice note is literally my comfort track! 🎵✨",
            "An absolute sovereign of this private space! 👑🌟",
            "Forever grateful for your beautiful support! 🥺💎",
            "Your presence makes everything look so vibrant! 🌈💕",
            "May your gorgeous smile never vanish! 🌸💖",
            "No firewall can stop this message flow! 🛡️❌",
            "You are the absolute best thing in my universe! ✨🌌",
            "Literally the queen of late-night conversations! 💬🌙",
            "Your care is my favorite parameter! 🍼❤️",
            "Stop fighting it, you are simply perfect! 😍🎀",
            "Even when you are angry, it's super precious! 😡💞",
            "A total monopoly on my happy thoughts! 📈💖",
            "The sweetest monitor in educational history! 📚✨",
            "My system runs 100% smoother when you ping! ⚡🚀",
            "You hold the primary access keys to my heart! 🔑🔐",
            "Celebrating your phenomenal existence today! 🎉👑"
        ];

        let trackingPhrasesUsedIndices = new Set();

        const needhzyTrapTalks = [
            "Oh no! Look what you triggered! 😂💥",
            "Hahaha! The capsules look so pretty! 😜🌸",
            "The screen is filled with pure truth! 💖💎",
            "They just keep multiplying! 🥰⚡",
            "Click the bottom button to unlock the birthday wishes! 🎂🚀"
        ];
        let trackingTalksPool = [...needhzyTrapTalks];

        function handleMascotLoadError(imgObj) {
            const currentSrc = imgObj.src;
            if (currentSrc.includes('images/')) {
                imgObj.src = currentSrc.replace('images/', '');
            }
        }

        const playSFX = (id) => {
            const audio = document.getElementById(id);
            if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initAmbientLighting();
        });

        function initiateMassivePopupBlast(buttonNode) {
            if (isBlastInitiated) return;
            isBlastInitiated = true;
            playSFX('sfxSuccess');

            gsap.to("#mainTriggerContainer", { scale: 0.9, opacity: 0, duration: 0.4, onComplete: () => {
                document.getElementById("mainTriggerContainer").remove();
            }});

            document.getElementById("progressMetrics").innerHTML = "DECRYPT STATUS: <span class='text-pink-400 font-black animate-pulse'>MATRIX OVERLOAD! 🚨</span>";

            let currentBurstCount = 0;
            const totalInitialBurst = 25;

            const burstTimerInterval = setInterval(() => {
                if (currentBurstCount >= totalInitialBurst) {
                    clearInterval(burstTimerInterval);
                    activateFinalProceedStationBar();
                    return;
                }
                spawnSingleCutePopupNode();
                currentBurstCount++;
            }, 60); 
        }

        function spawnSingleCutePopupNode() {
            if (activePopupsCounter >= 35) return;
            playSFX('sfxPop');

            const container = document.getElementById("popupSpawnPlane");
            const newPopup = document.createElement("div");

            activePopupsCounter++;
            currentSpawnIndex++;

            let chosenTextStr = "";
            if (trackingPhrasesUsedIndices.size < pureUniquePhrasesPool.length) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * pureUniquePhrasesPool.length);
                } while (trackingPhrasesUsedIndices.has(randomIndex));
                
                trackingPhrasesUsedIndices.add(randomIndex);
                chosenTextStr = pureUniquePhrasesPool[randomIndex];
            } else {
                chosenTextStr = pureUniquePhrasesPool[Math.floor(Math.random() * pureUniquePhrasesPool.length)];
            }

            const posX = Math.random() * 42 + 2;
            const posY = Math.random() * 66 + 2;

            newPopup.className = "absolute glass-pod-glow rounded-[2.2rem] p-3 py-4.5 text-center w-44 pointer-events-auto shadow-2xl premium-gpu select-none border border-pink-500/30";
            newPopup.style.left = `${posX}%`;
            newPopup.style.top = `${posY}%`;
            newPopup.style.zIndex = 100 + currentSpawnIndex;
            newPopup.id = `cutePopupBoxElement${currentSpawnIndex}`;

            const dynamicRotation = Math.random() * 16 - 8;

            newPopup.innerHTML = `
                <div class="absolute -top-2.5 -right-1 bg-gradient-to-tr from-pink-500 to-rose-500 text-white font-black text-[9px] w-5 h-5 rounded-full flex items-center justify-center cursor-pointer shadow-md border-2 border-white/30 scale-100 active:scale-90 transition-all" onclick="closePopupActionHandler(${currentSpawnIndex}, event)">💖</div>
                <p class="text-[9px] text-pink-100 font-extrabold leading-relaxed px-1 italic">“${chosenTextStr}”</p>
            `;

            container.appendChild(newPopup);

            gsap.fromTo(newPopup, { scale: 0, rotation: 0 }, { scale: 1, rotation: dynamicRotation, duration: 0.35, ease: "back.out(1.3)" });

            if (currentSpawnIndex % 3 === 0) triggerChibiExpressionShift();
        }

        function closePopupActionHandler(id, event) {
            event.stopPropagation();
            playSFX('sfxPop');

            const targetElement = document.getElementById(`cutePopupBoxElement${id}`);
            if (!targetElement) return;

            const r = targetElement.getBoundingClientRect();
            for(let i=0; i<5; i++) touchParticles.push(new TouchSparkle(r.left + (r.width/2), r.top + (r.height/2), '🌸'));

            gsap.to(targetElement, { scale: 0, opacity: 0, duration: 0.2, onComplete: () => {
                targetElement.remove();
                activePopupsCounter--;

                if (currentSpawnIndex < 40) {
                    setTimeout(() => { spawnSingleCutePopupNode(); }, 120);
                    setTimeout(() => { spawnSingleCutePopupNode(); }, 240);
                }
            }});
        }

        function triggerChibiExpressionShift() {
            const bubble = document.getElementById("dollBubble");
            const targetImg = document.getElementById("mascotDynamicImg");

            if (trackingTalksPool.length === 0) trackingTalksPool = [...needhzyTrapTalks];
            bubble.innerText = trackingTalksPool.splice(Math.floor(Math.random() * trackingTalksPool.length), 1)[0];

            const expressions = ["mascot_happy.png", "mascot_excited.png"];
            const randomImg = expressions[Math.floor(Math.random() * expressions.length)];
            
            targetImg.src = `images/${randomImg}`;
            targetImg.onerror = function() { this.onerror = null; this.src = randomImg; };

            setTimeout(() => {
                targetImg.src = "images/mascot.png";
                targetImg.onerror = function() { this.onerror = null; this.src = "mascot.png"; };
                bubble.innerText = "Close them if you can! 😜🚨";
            }, 3500);
        }

        function triggerMascotCoreTalk() {
            playSFX('sfxPop');
            triggerChibiExpressionShift();
            const r = document.getElementById("roamingDoll").getBoundingClientRect();
            for(let i=0; i<5; i++) touchParticles.push(new TouchSparkle(r.left + 35, r.top + 35, '✨'));
        }

        function activateFinalProceedStationBar() {
            const footerBar = document.getElementById("actionFooterBar");
            footerBar.classList.remove("hidden");
            
            setTimeout(() => {
                footerBar.classList.remove("opacity-0", "scale-90");
                footerBar.classList.add("opacity-100", "scale-100", "pointer-events-auto");
            }, 50);

            setInterval(() => {
                touchParticles.push(new TouchSparkle(Math.random() * window.innerWidth, Math.random() * window.innerHeight, '🌸'));
            }, 400);
        }

        function advanceToWishesGrandPage() {
            playSFX('sfxPop');
            gsap.to("body", { opacity: 0, duration: 0.5, onComplete: () => {
                window.location.href = "page9-wishes.html";
            }});
        }

        function initAmbientLighting() {
            const trackLayer = document.getElementById("asyncLightsMatrix");
            for(let i=0; i<5; i++) {
                const node = document.createElement("div");
                node.className = "async-glow-node premium-gpu";
                const size = Math.floor(Math.random() * 80) + 160;
                node.style.left = `calc(${(i * 20) + Math.random() * 5}vw - ${size/2}px)`;
                node.style.top = `${Math.floor(Math.random() * 50) + 10}px`;
                node.style.width = `${size}px`; node.style.height = `${size}px`;
                node.style.background = `radial-gradient(circle, rgba(244, 63, 94, 0.25) 0%, transparent 75%)`;
                trackLayer.appendChild(node);
            }
        }

        // TOUCH SPARKLE CANVAS ENGINE
        const touchCanvas = document.getElementById('touchCanvas');
        const tCtx = touchCanvas.getContext('2d');
        let touchParticles = [];
        touchCanvas.width = window.innerWidth; touchCanvas.height = window.innerHeight;

        class TouchSparkle {
            constructor(x, y, sym = '✨') {
                this.x = x; this.y = y; this.size = Math.random() * 12 + 10;
                this.speedX = (Math.random() - 0.5) * 4; this.speedY = (Math.random() - 0.5) * 4;
                this.opacity = 1; this.symbol = sym;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.opacity -= 0.02; }
            draw() { tCtx.save(); tCtx.globalAlpha = this.opacity; tCtx.font = `${this.size}px serif`; tCtx.fillText(this.symbol, this.x, this.y); tCtx.restore(); }
        }

        window.addEventListener('mousemove', (e) => { touchParticles.push(new TouchSparkle(e.clientX, e.clientY)); });
        window.addEventListener('touchmove', (e) => { if(e.touches.length) touchParticles.push(new TouchSparkle(e.touches[0].clientX, e.touches[0].clientY)); });

        function animateTouchTrail() {
            tCtx.clearRect(0, 0, touchCanvas.width, touchCanvas.height);
            for (let i = 0; i < touchParticles.length; i++) {
                touchParticles[i].update(); touchParticles[i].draw();
                if (touchParticles[i].opacity <= 0) { touchParticles.splice(i, 1); i--; }
            }
            requestAnimationFrame(animateTouchTrail);
        }
        animateTouchTrail();
    </script>
</body>
</html>
