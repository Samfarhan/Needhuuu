<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Journey | Celestial Vault Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,800;1,600&family=Playfair+Display:ital,wght=0,700;0,900;1,600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        .font-luxury { font-family: 'Playfair Display', serif; }
        .font-sans-premium { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .premium-gpu {
            will-change: transform, opacity, filter;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .animated-cosmic-bg {
            background: radial-gradient(circle at 50% 35%, rgba(20, 12, 38, 0.95) 0%, rgba(6, 4, 14, 0.98) 60%, #020106 100%), 
                        radial-gradient(circle at center, transparent 10%, rgba(0, 0, 0, 0.9) 100%);
            position: relative;
        }

        /* Ambient Aura Pulsing for Flowers & Background */
        @keyframes ambientBloom {
            0%, 100% { filter: drop-shadow(0 0 25px rgba(244, 63, 94, 0.25)) brightness(1.1); }
            50% { filter: drop-shadow(0 0 45px rgba(236, 72, 153, 0.45)) brightness(1.25); }
        }

        .original-center-bouquet {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -46%);
            width: 88%;
            max-width: 360px;
            pointer-events: none;
            z-index: 4; 
            animation: ambientBloom 6s ease-in-out infinite;
        }

        .single-bulbs-garland {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%) scale(1.03);
            width: 100%;
            max-width: 460px;
            height: auto;
            pointer-events: none;
            z-index: 30;
            mix-blend-mode: screen;
            filter: drop-shadow(0 10px 20px rgba(251, 191, 36, 0.3));
        }

        @keyframes safeStickerOrbit {
            0% { top: 12%; left: 8%; transform: scale(1) rotate(0deg); }
            25% { top: 14%; left: 65%; transform: scale(1.05) rotate(6deg); }
            50% { top: 68%; left: 68%; transform: scale(0.95) rotate(-6deg); }
            75% { top: 64%; left: 10%; transform: scale(1.03) rotate(4deg); }
            100% { top: 12%; left: 8%; transform: scale(1) rotate(0deg); }
        }
        .animate-constrained-sticker {
            position: fixed;
            animation: safeStickerOrbit 20s linear infinite;
        }

        .animate-glass-platform {
            animation: platformFloat 5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        @keyframes platformFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* 💎 ULTRA-AESTHETIC GLASS VAULT CARD */
        .glass-vault-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(15, 10, 30, 0.55) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.25),
                        0 0 40px rgba(244, 63, 94, 0.15);
        }

        /* Cyberpunk Pink Neon Ring Glow */
        .neon-input-glow {
            background: rgba(4, 2, 10, 0.75);
            border: 1px solid rgba(244, 63, 94, 0.3);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 15px rgba(244, 63, 94, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .neon-input-glow:focus-within {
            border-color: rgba(244, 63, 94, 0.8);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 25px rgba(244, 63, 94, 0.4);
        }

        .heart-mask {
            -webkit-text-security: none;
            color: #ff2a74 !important;
            text-shadow: 0 0 18px rgba(255, 42, 116, 0.8);
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .live-counter-engine {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 320px;
            margin-top: 12px;
        }
        .counter-slot {
            background: linear-gradient(135deg, rgba(20, 15, 38, 0.85), rgba(6, 4, 14, 0.95));
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 0 12px rgba(244, 63, 94, 0.2);
        }
        .counter-num {
            font-size: 24px;
            font-weight: 800;
            color: white;
            text-shadow: 0 0 12px #f43f5e;
            line-height: 1;
        }
        .counter-label {
            font-size: 8px;
            text-transform: uppercase;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.1em;
            margin-top: 4px;
        }

        .async-glow-node {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            filter: blur(50px);
            opacity: 0.6;
        }
        .gold-dust-node {
            position: absolute;
            background: radial-gradient(circle, rgba(253, 186, 116, 0.8) 0%, rgba(245, 158, 11, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body id="masterBody" class="animated-cosmic-bg text-slate-100 font-sans-premium min-h-screen w-full flex items-center justify-center overflow-hidden relative select-none">

    <!-- DYNAMIC AMBIENT LIGHTING LAYER -->
    <div id="asyncLightsMatrix" class="absolute inset-0 pointer-events-none z-0"></div>
    <div id="goldDustMatrixContainer" class="absolute inset-0 pointer-events-none overflow-hidden z-10"></div>

    <!-- PRESERVED DECORATIVE ASSETS WITH AUTOMATIC FALLBACKS -->
    <img src="images/bulbs-string.png" onerror="this.onerror=null; this.src='bulbs-string.png';" class="single-bulbs-garland premium-gpu" alt="Hanging Bulbs String">
    <img src="images/lotus-bg.png" onerror="this.onerror=null; this.src='lotus-bg.png';" class="original-center-bouquet premium-gpu" alt="Original Center Bouquet">

    <canvas id="touchCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-40"></canvas>

    <!-- 🌸 FLOATING MASCOT STICKER LOOP -->
    <div id="roamingDoll" onclick="handleDynamicStickerClicks()" class="animate-constrained-sticker w-20 h-28 cursor-pointer select-none z-50 premium-gpu filter drop-shadow-[0_12px_25px_rgba(244,63,94,0.35)]">
        <img id="mascotDynamicImg" src="images/mascot.png" onerror="handleMascotLoadError(this)" class="w-full h-full object-contain" alt="Cute Mascot Doll">
        <div id="dollBubble" class="absolute -top-11 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md border border-pink-500/30 py-1 px-3 rounded-xl shadow-lg text-[9px] font-extrabold text-pink-300 tracking-wide scale-100 transition-all duration-300 whitespace-nowrap">
            Tap for Today's Key! 🔑🌸
        </div>
    </div>

    <!-- 📱 MAIN PORTABLE FRAME CONTAINMENT -->
    <div class="phone-container relative z-20 px-4">
        <div id="magneticWrapper" class="w-full flex flex-col items-center justify-center relative premium-gpu animate-glass-platform py-4">
            
            <!-- 🔮 AESTHETIC RE-DESIGNED SECURITY INPUT CARD -->
            <div id="passcodePortal" class="w-full rounded-[2.5rem] p-7 text-center relative premium-gpu glass-vault-card transition-all duration-500">
                <div class="flex items-center justify-center gap-2 mb-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-ping"></span>
                    <span class="text-[9px] font-extrabold tracking-[0.5em] text-pink-400 uppercase">CELESTIAL VAULT ACCESS</span>
                </div>
                
                <h1 class="font-luxury font-black text-3xl text-transparent bg-clip-text bg-gradient-to-r from-white via-pink-100 to-rose-300 mb-6 tracking-tight drop-shadow-sm">
                    Decrypt Your Sky ☁️
                </h1>
                
                <div class="relative w-full mb-5 neon-input-glow rounded-2xl p-1">
                    <div id="heartDisplayOverlay" class="absolute inset-0 flex items-center justify-center text-2xl font-bold tracking-[0.45em] pointer-events-none heart-mask text-center w-full z-10 select-none"></div>
                    <input type="text" id="secretInput" pattern="[0-9]*" inputmode="numeric" maxlength="4" placeholder="••••" oninput="processHeartTextFormatting(this)"
                        class="w-full text-center text-2xl font-bold tracking-[0.45em] py-3.5 bg-transparent focus:outline-none opacity-100 text-transparent select-none caret-pink-500 font-sans-premium relative z-0 placeholder-slate-600 transition-all duration-300" style="-webkit-text-fill-color: transparent; -webkit-user-select: none;" />
                </div>
                
                <button onclick="verifySecretCode()" class="w-full bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-extrabold tracking-[0.25em] text-[10px] py-4 rounded-xl shadow-[0_10px_25px_rgba(244,63,94,0.4)] border border-white/20 active:scale-[0.98] transition-all duration-200 premium-gpu">
                    INITIALIZE UNIVERSE 🚀
                </button>
                <p id="errorFeedback" class="text-[9px] text-rose-400 font-extrabold mt-3 h-3 tracking-wider uppercase drop-shadow"></p>
            </div>

            <!-- 🌸 SMOOTH GREETING & TRANSITION CARD -->
            <div id="surprisePortal" class="w-full rounded-[2.5rem] p-7 text-center absolute z-20 premium-gpu opacity-0 scale-75 pointer-events-none transition-all duration-500 glass-vault-card flex flex-col items-center">
                <span id="surpriseDayBadge" class="text-[9px] font-extrabold tracking-[0.45em] text-pink-400 uppercase block mb-1">GALAXY UNLOCKED</span>
                
                <div class="bg-slate-950/60 border border-white/10 rounded-2xl p-5 mb-4 mt-2 text-center w-full shadow-inner">
                    <h3 id="surpriseTitle" class="font-luxury font-black text-white text-xl leading-snug mb-2 tracking-wide text-pink-400">Happy Birthday! 🎉🎂</h3>
                    <p id="surpriseBody" class="text-xs font-semibold text-slate-200 leading-relaxed tracking-wide">Welcome to your ultimate magical space! Opening your special world in just a moment... ❤️✨</p>
                </div>

                <p class="text-[8px] font-extrabold text-slate-400 uppercase tracking-widest mb-1 mt-2">Time Left Until 31st July Cosmic Explosion 🪐</p>
                <div class="live-counter-engine font-sans-premium">
                    <div class="counter-slot"> <div id="cDays" class="counter-num">00</div> <div class="counter-label">Days</div> </div>
                    <div class="counter-slot"> <div id="cHours" class="counter-num">00</div> <div class="counter-label">Hours</div> </div>
                    <div class="counter-slot"> <div id="cMins" class="counter-num">00</div> <div class="counter-label">Mins</div> </div>
                    <div class="counter-slot"> <div id="cSecs" class="counter-num">00</div> <div class="counter-label">Secs</div> </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SECRET_KEY = "2910";
        let isPasswordResolved = false;
        let dollTapsCount = 0;

        function handleMascotLoadError(imgObj) {
            const currentSrc = imgObj.src;
            if (currentSrc.includes('images/')) {
                imgObj.src = currentSrc.replace('images/', '');
            }
        }

        function setMascotImage(fileName) {
            const targetImg = document.getElementById('mascotDynamicImg');
            targetImg.src = `images/${fileName}`;
            targetImg.onerror = function() {
                this.onerror = null;
                this.src = fileName;
            };
        }

        function handleDynamicStickerClicks() {
            const bubble = document.getElementById("dollBubble");
            const dollNode = document.getElementById("roamingDoll");
            
            gsap.fromTo(dollNode, { scale: 0.9, rotation: -8 }, { scale: 1.08, rotation: 8, duration: 0.3, ease: "back.out(1.5)" });

            if (!isPasswordResolved) {
                dollTapsCount++;
                if (dollTapsCount === 1) {
                    setMascotImage("mascot_confused.png");
                    bubble.innerText = "Hehe, looking for today's code? 😜";
                } else if (dollTapsCount === 2) {
                    bubble.innerText = "One more tap and I'll spill! 🤫🌸";
                } else if (dollTapsCount >= 3) {
                    setMascotImage("mascot_happy.png");
                    bubble.innerText = `Today's Key is ${SECRET_KEY}! 🔑✨`;
                    setTimeout(() => { 
                        setMascotImage("mascot.png"); 
                        bubble.innerText = "Tap for Today's Key! 🔑🌸";
                        dollTapsCount = 0; 
                    }, 5000);
                }
            } else {
                setMascotImage("mascot_excited.png");
                bubble.innerText = "Warping to your universe! 🥰🚀";
            }
        }

        function verifySecretCode() {
            const inputField = document.getElementById('secretInput');
            const errorBox = document.getElementById('errorFeedback');

            if (inputField.value.trim() === SECRET_KEY) {
                isPasswordResolved = true;
                
                setMascotImage("mascot_happy.png");
                document.getElementById("dollBubble").innerText = "YAY! Access Granted! 😍🎉";

                triggerCelebrationFairyRain();

                gsap.to("#passcodePortal", {
                    y: 40, opacity: 0, scale: 0.8, duration: 0.45, ease: "power3.in",
                    onComplete: () => {
                        document.getElementById("passcodePortal").remove();
                        startGalaxyCountdownEngine();
                        const surpriseCard = document.getElementById("surprisePortal");
                        surpriseCard.classList.remove("pointer-events-none", "opacity-0", "scale-75");
                        surpriseCard.classList.add("opacity-100", "scale-100", "pointer-events-auto");
                        
                        setTimeout(() => {
                            gsap.to("body", {
                                opacity: 0,
                                duration: 0.8,
                                onComplete: () => {
                                    window.location.href = "page1-welcome.html";
                                }
                            });
                        }, 2500);
                    }
                });
            } else {
                errorBox.innerText = "INVALID KEY! TRY AGAIN! 🔒";
                inputField.value = "";
                document.getElementById("heartDisplayOverlay").innerText = ""; 
                gsap.fromTo("#passcodePortal", { x: -10 }, { x: 10, duration: 0.04, repeat: 4, yoyo: true });
            }
        }

        function startGalaxyCountdownEngine() {
            const target = new Date("July 31, 2026 00:00:00").getTime();
            function update() {
                const now = new Date().getTime();
                const dist = target - now;
                if (dist < 0) return;
                
                const d = Math.floor(dist / (1000 * 60 * 60 * 24));
                const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((dist % (1000 * 60)) / 1000);
                
                document.getElementById("cDays").innerText = d < 10 ? "0" + d : d;
                document.getElementById("cHours").innerText = h < 10 ? "0" + h : h;
                document.getElementById("cMins").innerText = m < 10 ? "0" + m : m;
                document.getElementById("cSecs").innerText = s < 10 ? "0" + s : s;
            }
            update();
            setInterval(update, 1000);
        }

        function triggerCelebrationFairyRain() {
            for (let i = 0; i < 45; i++) {
                setTimeout(() => {
                    touchParticles.push(new TouchSparkle(Math.random() * window.innerWidth, -20, ['🌸', '💖', '✨', '🌹'][Math.floor(Math.random() * 4)]));
                }, i * 50);
            }
        }

        function initAsynchronousLightingMatrix() {
            const trackLayer = document.getElementById("asyncLightsMatrix");
            for(let i=0; i<6; i++) {
                const node = document.createElement("div");
                node.className = "async-glow-node premium-gpu";
                const size = Math.floor(Math.random() * 80) + 150;
                node.style.left = `calc(${(i * 16) + Math.random() * 5}vw - ${size/2}px)`;
                node.style.top = `${Math.floor(Math.random() * 40) + 10}px`;
                node.style.width = `${size}px`; node.style.height = `${size}px`;
                trackLayer.appendChild(node);
                node.style.background = `radial-gradient(circle, rgba(244, 63, 94, 0.3) 0%, transparent 70%)`;
            }
            initGoldenDustMatrixEngine();
        }

        function initGoldenDustMatrixEngine() {
            const dustBox = document.getElementById("goldDustMatrixContainer");
            for(let i = 0; i < 30; i++) {
                const singleParticle = document.createElement("div");
                singleParticle.className = "gold-dust-node premium-gpu";
                const dimension = Math.random() * 4 + 2; 
                singleParticle.style.width = dimension + "px"; singleParticle.style.height = dimension + "px";
                singleParticle.style.left = Math.random() * 100 + "vw"; singleParticle.style.top = Math.random() * 100 + "vh";
                dustBox.appendChild(singleParticle);
                gsap.to(singleParticle, { y: "-=" + (Math.random() * 120 + 80), opacity: 0, duration: Math.random() * 8 + 6, repeat: -1, ease: "sine.inOut" });
            }
        }

        function processHeartTextFormatting(inputElement) {
            inputElement.value = inputElement.value.replace(/[^0-9]/g, '');
            let heartString = "";
            for (let i = 0; i < inputElement.value.length; i++) heartString += "💖";
            document.getElementById("heartDisplayOverlay").innerText = heartString;
        }

        const touchCanvas = document.getElementById('touchCanvas');
        const tCtx = touchCanvas.getContext('2d');
        let touchParticles = [];
        touchCanvas.width = window.innerWidth; touchCanvas.height = window.innerHeight;

        class TouchSparkle {
            constructor(x, y, symbol = null) {
                this.x = x; this.y = y; this.size = Math.random() * 12 + 12;
                this.speedX = (Math.random() - 0.5) * 3; this.speedY = symbol ? Math.random() * 2 + 1 : (Math.random() - 0.5) * 3;
                this.opacity = 1;
                this.sym = symbol ? symbol : ['✨', '🌸', '💖'][Math.floor(Math.random() * 3)];
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.opacity -= 0.015; }
            draw() { tCtx.save(); tCtx.globalAlpha = this.opacity; tCtx.font = `${this.size}px serif`; tCtx.fillText(this.sym, this.x, this.y); tCtx.restore(); }
        }

        window.addEventListener('mousemove', (e) => { touchParticles.push(new TouchSparkle(e.clientX, e.clientY)); });
        window.addEventListener('touchmove', (e) => { if(e.touches.length) touchParticles.push(new TouchSparkle(e.touches[0].clientX, e.touches[0].clientY)); });

        function animateTouchTrail() {
            tCtx.clearRect(0, 0, touchCanvas.width, touchCanvas.height);
            for (let i = 0; i < touchParticles.length; i++) {
                touchParticles[i].update(); touchParticles[i].draw();
                if (touchParticles[i].opacity <= 0) { touchParticles.splice(i, 1); i--; }
            }
            requestAnimationFrame(animateTouchTrail);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initAsynchronousLightingMatrix();
            animateTouchTrail();
        });
    </script>
</body>
</html>
